      <a href="/" class="drawer-link active" data-page="chat">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5.5l-3 3V4.5a1 1 0 0 1 1-1z"/></svg>

    <div class="sidebar-header">
      <span class="sidebar-title">Chats</span>
      <button class="new-chat-btn" id="newChatBtn" aria-label="New chat">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <line x1="6" y1="1" x2="6" y2="11"/>
          <line x1="1" y1="6" x2="11" y2="6"/>
        </svg>
      </button>

  <!-- ── MAIN ── -->
  <div class="main">

    <!-- Header -->
    <header class="header">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open conversations" aria-expanded="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <line x1="2" y1="4" x2="14" y2="4"/>
          <line x1="2" y1="8" x2="14" y2="8"/>
          <line x1="2" y1="12" x2="14" y2="12"/>
        </svg>
      </button>
      <div class="header-title" id="pageTitle">New conversation</div>
      <div class="header-controls">
        <span class="agent-badge" id="agentBadge"></span>
        <select id="modelSelector" aria-label="Select model">
          <option value="">Select model</option>
        </select>
      </div>
    </header>

    <!-- Messages -->
    <div class="messages-area" id="messagesContainer" role="log" aria-live="polite" aria-label="Conversation">
      <div class="messages-inner" id="messagesInner">

        <div class="welcome" id="welcomeState">
          <div class="welcome-logo" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2"  y="2"  width="7" height="7" rx="2" fill="rgba(255,255,255,0.70)"/>
              <rect x="11" y="2"  width="7" height="7" rx="2" fill="rgba(255,255,255,0.35)"/>
              <rect x="2"  y="11" width="7" height="7" rx="2" fill="rgba(255,255,255,0.35)"/>
              <rect x="11" y="11" width="7" height="7" rx="2" fill="rgba(255,255,255,0.18)"/>
            </svg>
          </div>
          <h2>Mindbase</h2>
          <p>Your AI workspace. Start a conversation below.</p>
        </div>

        <div class="typing-indicator" id="typingIndicator" aria-label="Assistant is typing">
          <div class="msg-avatar" aria-hidden="true">AI</div>
          <div class="typing-dots" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>

      </div>
    </div>

    <!-- Composer -->
    <div class="composer-wrap">
      <div class="composer">
        <input
          type="text"
          id="messageInput"
          placeholder="Message Mindbase…"
          autocomplete="off"
          aria-label="Message input"
        />
        <button class="send-btn" id="sendBtn" aria-label="Send message">
          <svg class="arrow" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="7.5" y1="13" x2="7.5" y2="2"/>
            <polyline points="3 6 7.5 2 12 6"/>
          </svg>
          <svg class="spinner" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="7.5" cy="7.5" r="5.5" stroke-dasharray="28" stroke-dashoffset="10"/>
          </svg>
        </button>
      </div>
    </div>

  </div><!-- /main -->

  <!-- Mobile drawer scrim -->
  <div class="scrim" id="sidebarScrim" aria-hidden="true"></div>

<!-- Toast notifications -->
<div class="toast-host" id="toastHost" role="status" aria-live="polite"></div>
