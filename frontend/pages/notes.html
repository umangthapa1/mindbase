<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — Mindbase</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="../../css/globals.css?v=20260728">
  <link rel="stylesheet" href="page-theme.css?v=20260728">
  <style>
    html,body { overflow:hidden; height:100%; }
    .notes-shell { display:flex; height:100vh; }

    /* Sidebar */
    .notes-sidebar { width:220px; flex-shrink:0; background:var(--glass-bg); border-right:1px solid var(--glass-border); display:flex; flex-direction:column; }
    .notes-sidebar-header { padding:14px; border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .notes-sidebar-title { font-size:10.5px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-tertiary); }
    .notes-list { flex:1; overflow-y:auto; padding:6px; }
    .note-item { padding:8px 10px; border-radius:7px; cursor:pointer; color:var(--text-secondary); font-size:12.5px; font-weight:300; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:background 140ms ease, color 140ms ease; }
    .note-item:hover { background:var(--bg-hover); color:var(--text-primary); }
    .note-item.active { background:var(--bg-active); color:var(--text-primary); }
    .notes-sidebar-footer { padding:12px 14px; border-top:1px solid var(--border-subtle); flex-shrink:0; }

    /* Editor */
    .notes-editor { flex:1; display:flex; flex-direction:column; min-width:0; }
    .notes-editor-header { height:52px; flex-shrink:0; background:var(--glass-bg); border-bottom:1px solid var(--glass-border); padding:0 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .notes-editor-header input { flex:1; background:transparent; border:none; outline:none; color:var(--text-primary); font-size:14px; font-family:var(--font); font-weight:500; }
    .format-toolbar { height:40px; flex-shrink:0; background:var(--bg-surface); border-bottom:1px solid var(--border-subtle); padding:0 16px; display:flex; align-items:center; gap:3px; overflow-x:auto; }
    .fmt-btn { padding:4px 8px; border-radius:5px; border:none; background:transparent; color:var(--text-secondary); font-family:var(--font); font-size:12px; cursor:pointer; transition:background 120ms ease, color 120ms ease; white-space:nowrap; }
    .fmt-btn:hover { background:var(--bg-hover); color:var(--text-primary); }
    #noteContent { flex:1; background:var(--bg-void); color:var(--text-primary); border:none; outline:none; resize:none; padding:24px 28px; font-family:var(--mono); font-size:13px; font-weight:300; line-height:1.7; }
    .notes-empty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); font-size:13px; font-weight:300; }

    /* Preview */
    .preview-pane { width:360px; flex-shrink:0; background:var(--bg-surface); border-left:1px solid var(--border-subtle); overflow-y:auto; padding:24px; }
    .preview-label { font-size:10.5px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:16px; }
    .preview-content { font-size:13px; font-weight:300; color:var(--text-secondary); line-height:1.7; }
    .preview-content h1,.preview-content h2,.preview-content h3 { font-weight:500; color:var(--text-primary); margin:14px 0 6px; }
    .preview-content p { margin:6px 0; }
    .preview-content code { font-family:var(--mono); font-size:12px; background:var(--bg-elevated); border:1px solid var(--border-subtle); border-radius:3px; padding:1px 5px; }
    .preview-content pre { background:var(--bg-elevated); border:1px solid var(--border-subtle); border-radius:7px; padding:12px; overflow-x:auto; margin:10px 0; }
    .preview-content ul,.preview-content ol { padding-left:18px; margin:6px 0; }
    .preview-content blockquote { border-left:2px solid var(--border-mid); padding-left:12px; color:var(--text-tertiary); margin:8px 0; }

    /* ── Mobile: stack the 3-pane shell vertically ── */
    @media (max-width: 768px) {
      .notes-shell { flex-direction: column; }
      .notes-sidebar { width: 100%; max-height: 36vh; border-right: none; border-bottom: 1px solid var(--glass-border); }
      .notes-editor { flex: 1; min-height: 0; }
      .notes-editor-header { padding: 0 14px; }
      #noteContent { padding: 18px 16px; }
      .preview-pane { width: 100%; border-left: none; border-top: 1px solid var(--border-subtle); max-height: 45vh; }
    }
  </style>
</head>
<body>
<script src="../js/dock.js?v=20260728"></script>
<div class="notes-shell">

  <!-- Sidebar -->
  <div class="notes-sidebar">
    <div class="notes-sidebar-header">
      <span class="notes-sidebar-title">Notes</span>
      <button class="btn btn-ghost" id="newNoteBtn" style="padding:3px 8px;font-size:16px;line-height:1">+</button>
    </div>
    <div class="notes-list" id="notesList"><div class="conv-empty" style="padding:10px">No notes yet</div></div>
    <div class="notes-sidebar-footer">
      <a href="/" class="back-link" style="font-size:11px">← Chat</a>
    </div>
  </div>

  <!-- Editor -->
  <div class="notes-editor">

    <div class="notes-editor-header" id="editorHeader" style="display:none">
      <input id="noteTitle" type="text" placeholder="Untitled">
      <div style="display:flex;gap:8px;align-items:center">
        <span id="saveStatus" aria-live="polite" style="font-size:11px;color:var(--text-tertiary);min-width:48px;text-align:right"></span>
        <button class="btn btn-ghost" id="togglePreviewBtn" style="font-size:12px;padding:5px 10px">Preview</button>
        <button class="btn btn-danger" id="deleteNoteBtn" style="font-size:12px;padding:5px 10px">Delete</button>
      </div>
    </div>

    <div class="format-toolbar" id="formatToolbar" style="display:none">
      <button class="fmt-btn" data-format="heading">H1</button>
      <button class="fmt-btn" data-format="bold" style="font-weight:500">B</button>
      <button class="fmt-btn" data-format="italic" style="font-style:italic">I</button>
      <button class="fmt-btn" data-format="bullet">• List</button>
      <button class="fmt-btn" data-format="numbered">1. List</button>
      <button class="fmt-btn" data-format="quote">" Quote</button>
      <button class="fmt-btn" data-format="code">{ Code }</button>
      <button class="fmt-btn" data-format="link">Link</button>
    </div>

    <div class="notes-empty" id="emptyState">Create a new note to get started</div>
    <textarea id="noteContent" style="display:none"></textarea>
  </div>

  <!-- Preview -->
  <div class="preview-pane" id="previewPane" style="display:none">
    <div class="preview-label">Preview</div>
    <div class="preview-content" id="previewContent"></div>
  </div>

</div>

<script src="../js/toast.js"></script>
<script>
  const API_BASE = '/api';
  let currentNote = null, autoSaveTimeout = null;

  async function loadNotes() {
    try {
      const res = await fetch(`${API_BASE}/notes`);
      const data = await res.json();
      displayNotes(data.notes || []);
    } catch(e) { console.error(e); }
  }

  function displayNotes(notes) {
    const list = document.getElementById('notesList');
    if (!notes.length) { list.innerHTML = '<div class="conv-empty" style="padding:10px">No notes yet</div>'; return; }
    list.innerHTML = notes.map(n => `<div class="note-item${currentNote?.id===n.id?' active':''}" data-id="${n.id}">${n.title||'Untitled'}</div>`).join('');
    list.querySelectorAll('.note-item').forEach(el => el.addEventListener('click', () => openNote(el.dataset.id)));
  }

  async function openNote(id) {
    try {
      const note = await fetch(`${API_BASE}/notes/${id}`).then(r => r.json());
      currentNote = note;
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('editorHeader').style.display = 'flex';
      document.getElementById('formatToolbar').style.display = 'flex';
      document.getElementById('noteContent').style.display = 'block';
      document.getElementById('noteTitle').value = note.title || '';
      document.getElementById('noteContent').value = note.content || '';
      loadNotes();
      updatePreview();
      setSaveStatus('');
    } catch(e) { toast('Could not open note.', 'error'); }
  }

  document.getElementById('newNoteBtn').addEventListener('click', async () => {
    try {
      const note = await fetch(`${API_BASE}/notes`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:'Untitled'})}).then(r=>r.json());
      currentNote = note;
      await loadNotes();
      await openNote(note.id);
    } catch(e) { toast('Could not create note.', 'error'); }
  });

  function setSaveStatus(text) {
    const el = document.getElementById('saveStatus');
    if (el) el.textContent = text;
  }

  function autoSave() {
    if (!currentNote) return;
    clearTimeout(autoSaveTimeout);
    setSaveStatus('Saving…');
    autoSaveTimeout = setTimeout(async () => {
      try {
        await fetch(`${API_BASE}/notes/${currentNote.id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:document.getElementById('noteTitle').value, content:document.getElementById('noteContent').value})});
        currentNote.title = document.getElementById('noteTitle').value;
        loadNotes();
        setSaveStatus('Saved');
      } catch(e) {
        console.error(e);
        setSaveStatus('');
        toast('Could not save note.', 'error');
      }
    }, 1200);
  }

  window.addEventListener('beforeunload', e => { if (autoSaveTimeout) { e.preventDefault(); e.returnValue=''; } });

  function replaceSelection(transform) {
    const ta = document.getElementById('noteContent');
    const s = ta.selectionStart, e = ta.selectionEnd;
    const sel = ta.value.slice(s,e);
    const rep = transform(sel||'');
    ta.value = ta.value.slice(0,s)+rep+ta.value.slice(e);
    ta.focus(); ta.setSelectionRange(s,s+rep.length);
    updatePreview(); autoSave();
  }

  function formatLines(prefix, placeholder) {
    replaceSelection(sel => (sel||placeholder).split('\n').map(l=>l.trim()?`${prefix}${l}`:l).join('\n'));
  }

  const formats = {
    heading:  () => formatLines('# ','Heading'),
    bold:     () => replaceSelection(t=>`**${t||'bold text'}**`),
    italic:   () => replaceSelection(t=>`*${t||'italic text'}*`),
    bullet:   () => formatLines('- ','List item'),
    numbered: () => replaceSelection(sel=>(sel||'List item').split('\n').map((l,i)=>l.trim()?`${i+1}. ${l}`:l).join('\n')),
    quote:    () => formatLines('> ','Quote'),
    code:     () => replaceSelection(t=>t.includes('\n')?`\`\`\`\n${t}\n\`\`\``:`\`${t||'code'}\``),
    link:     () => replaceSelection(t=>`[${t||'Link text'}](https://example.com)`)
  };

  document.querySelectorAll('.fmt-btn').forEach(btn => btn.addEventListener('click', () => formats[btn.dataset.format]?.()));

  document.getElementById('noteTitle').addEventListener('input', autoSave);
  document.getElementById('noteContent').addEventListener('input', () => { autoSave(); updatePreview(); });

  function updatePreview() {
    document.getElementById('previewContent').innerHTML = marked.parse(document.getElementById('noteContent').value);
  }

  document.getElementById('togglePreviewBtn').addEventListener('click', () => {
    const pane = document.getElementById('previewPane');
    pane.style.display = pane.style.display==='none' ? 'block' : 'none';
  });

  document.getElementById('deleteNoteBtn').addEventListener('click', async () => {
    if (!currentNote || !await confirmDialog('Delete this note?')) return;
    await fetch(`${API_BASE}/notes/${currentNote.id}`, {method:'DELETE'});
    currentNote = null;
    document.getElementById('emptyState').style.display='flex';
    document.getElementById('editorHeader').style.display='none';
    document.getElementById('formatToolbar').style.display='none';
    document.getElementById('noteContent').style.display='none';
    loadNotes();
    toast('Note deleted', 'info');
  });

  loadNotes();
</script>
</body>
</html>
