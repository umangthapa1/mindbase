<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Notes — Mindbase</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../js/theme.js?v=20260822"></script>
  <script src="../js/accent.js?v=20260802"></script>
  <link rel="stylesheet" href="../css/globals.css?v=20261001ui">
  <link rel="stylesheet" href="page-theme.css?v=20261001ui">
  <style>
    html, body { overflow:hidden; height:100%; }
    .notes-page { height:100vh; height:100dvh; min-height:0; }
    .notes-shell { display:flex; flex:1; min-height:0; min-width:0; }

    .notes-sidebar { width:240px; min-width:0; flex-shrink:0; background:var(--bg-surface); border-right:1px solid var(--border-subtle); display:flex; flex-direction:column; }
    .notes-sidebar-header { padding:16px; border-bottom:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0; }
    .notes-sidebar-title { font-size:13px; font-weight:600; color:var(--text-secondary); }
    .notes-list { flex:1; min-height:0; overflow-y:auto; padding:8px; }
    .note-item { padding:10px 12px; min-height:40px; border-radius:8px; cursor:pointer; color:var(--text-secondary); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:background 140ms ease, color 140ms ease; }
    .note-item:hover { background:var(--bg-hover); color:var(--text-primary); }
    .note-item.active { background:var(--bg-active); color:var(--text-primary); box-shadow:inset 3px 0 var(--accent); }
    .notes-sidebar-footer { padding:16px; border-top:1px solid var(--border-subtle); flex-shrink:0; }
    .has-app-dock .notes-sidebar-footer { display:none; }

    .notes-editor { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
    .notes-editor-header { min-height:64px; flex-shrink:0; background:var(--bg-surface); border-bottom:1px solid var(--border-subtle); padding:12px 16px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
    .notes-editor-header input { flex:1 1 180px; min-width:0; font-size:16px; font-weight:500; }
    .notes-editor-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; min-width:0; max-width:100%; }
    #saveStatus { font-size:12px; color:var(--text-secondary); min-width:48px; text-align:right; }
    .notes-editor-actions .btn { padding:8px 12px; font-size:13px; }
    .format-toolbar { min-height:48px; flex-shrink:0; background:var(--bg-surface); border-bottom:1px solid var(--border-subtle); padding:4px 16px; display:flex; align-items:center; gap:4px; overflow-x:auto; }
    .fmt-btn { min-height:36px; min-width:36px; padding:6px 8px; flex-shrink:0; border-radius:8px; border:none; background:transparent; color:var(--text-secondary); font:400 13px var(--font); cursor:pointer; white-space:nowrap; }
    .fmt-btn:hover { background:var(--bg-hover); color:var(--text-primary); }
    #noteContent { flex:1; min-height:160px; background:var(--bg-void); color:var(--text-primary); border:0; border-radius:0; resize:none; padding:24px; font:400 14px/1.8 var(--mono); }
    #noteContent:focus-visible { outline-offset:-3px; }
    .notes-empty { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:var(--text-secondary); font-size:14px; }

    .preview-pane { width:clamp(260px, 28vw, 360px); min-width:0; flex-shrink:0; background:var(--bg-surface); border-left:1px solid var(--border-subtle); overflow-y:auto; padding:24px; }
    .preview-label { font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:16px; }
    .preview-content { font-size:14px; color:var(--text-secondary); line-height:1.7; overflow-wrap:anywhere; }
    .preview-content h1,.preview-content h2,.preview-content h3 { font-weight:600; color:var(--text-primary); margin:16px 0 8px; }
    .preview-content p { margin:8px 0; }
    .preview-content pre { background:var(--bg-raised); border:1px solid var(--border-subtle); border-radius:8px; padding:12px; overflow-x:auto; margin:12px 0; }
    .preview-content ul,.preview-content ol { padding-left:20px; margin:8px 0; }
    .preview-content blockquote { border-left:2px solid var(--border-mid); padding-left:12px; color:var(--text-secondary); margin:8px 0; }
    .preview-content img { max-width:100%; }

    /* Keep a useful editor width before a third pane can squeeze it. */
    @media (max-width:1100px) {
      .notes-shell { display:grid; grid-template-columns:220px minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto; }
      .notes-sidebar { width:auto; grid-column:1; grid-row:1 / 3; }
      .notes-editor { grid-column:2; grid-row:1; }
      .preview-pane { grid-column:2; width:auto; max-height:30vh; border-left:0; border-top:1px solid var(--border-subtle); padding:16px; }
    }
    @media (max-width:760px) {
      .notes-shell { display:flex; flex-direction:column; overflow-y:auto; }
      .notes-sidebar { width:100%; max-height:176px; border-right:0; border-bottom:1px solid var(--border-subtle); }
      .notes-sidebar-header { padding:8px 16px; }
      .notes-list { min-height:56px; }
      .notes-editor { flex:1 0 360px; }
      .notes-editor-actions { flex:1; }
      .notes-editor-header input { flex-basis:100%; }
      #noteContent { padding:16px; }
      .preview-pane { width:100%; max-height:40vh; min-height:160px; }
    }
  </style>
</head>
<body>
<script src="../js/dock.js?v=20261001ui"></script>
<div class="page-root notes-page">
  <header class="page-header">
    <div class="page-heading"><h1 class="page-title">Notes</h1><p class="page-subtitle">Capture ideas and keep your writing in one place.</p></div>
  </header>
<div class="notes-shell">

  <!-- Sidebar -->
  <div class="notes-sidebar">
    <div class="notes-sidebar-header">
      <span class="notes-sidebar-title">Your notes</span>
      <button class="btn btn-ghost" id="newNoteBtn">New note</button>
    </div>
    <div class="notes-list" id="notesList"><div class="conv-empty" style="padding:10px">No notes yet</div></div>
    <div class="notes-sidebar-footer">
      <a href="/" class="back-link" style="font-size:11px">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="7 2 3 6 7 10"/><line x1="3" y1="6" x2="10" y2="6"/></svg>
        Chat
      </a>
    </div>
  </div>

  <!-- Editor -->
  <div class="notes-editor">

    <div class="notes-editor-header" id="editorHeader" style="display:none">
      <input id="noteTitle" type="text" placeholder="Untitled" aria-label="Note title">
      <div class="notes-editor-actions">
        <span id="saveStatus" aria-live="polite"></span>
        <button class="btn btn-ghost" id="togglePreviewBtn">Preview</button>
        <button class="btn btn-danger" id="deleteNoteBtn">Delete</button>
      </div>
    </div>

    <div class="format-toolbar" id="formatToolbar" style="display:none">
      <button class="fmt-btn" data-format="heading">H1</button>
      <button class="fmt-btn" data-format="bold" style="font-weight:500">B</button>
      <button class="fmt-btn" data-format="italic" style="font-style:italic">I</button>
      <button class="fmt-btn" data-format="bullet">• List</button>
      <button class="fmt-btn" data-format="numbered">1. List</button>
      <button class="fmt-btn" data-format="quote">" Quote</button>
      <button class="fmt-btn" data-format="code">{ Code }</button>
      <button class="fmt-btn" data-format="link">Link</button>
    </div>

    <div class="notes-empty" id="emptyState">Create a new note to get started</div>
    <textarea id="noteContent" aria-label="Note content" style="display:none"></textarea>
  </div>

  <!-- Preview -->
  <div class="preview-pane" id="previewPane" style="display:none">
    <div class="preview-label">Preview</div>
    <div class="preview-content" id="previewContent"></div>
  </div>

</div>
</div>

<script src="../js/toast.js"></script>
<script>
  const API_BASE = '/api';
  let currentNote = null, autoSaveTimeout = null;

  async function loadNotes() {
    try {
      const res = await fetch(`${API_BASE}/notes`);
      const data = await res.json();
      displayNotes(data.notes || []);
    } catch(e) { console.error(e); }
  }

  function displayNotes(notes) {
    const list = document.getElementById('notesList');
    if (!notes.length) { list.innerHTML = '<div class="conv-empty" style="padding:10px">No notes yet</div>'; return; }
    list.innerHTML = notes.map(n => `<div class="note-item${currentNote?.id===n.id?' active':''}" data-id="${n.id}">${n.title||'Untitled'}</div>`).join('');
    list.querySelectorAll('.note-item').forEach(el => el.addEventListener('click', () => openNote(el.dataset.id)));
  }

  async function openNote(id) {
    try {
      await forceSavePending();
      const note = await fetch(`${API_BASE}/notes/${id}`).then(r => r.json());
      currentNote = note;
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('editorHeader').style.display = 'flex';
      document.getElementById('formatToolbar').style.display = 'flex';
      document.getElementById('noteContent').style.display = 'block';
      document.getElementById('noteTitle').value = note.title || '';
      document.getElementById('noteContent').value = note.content || '';
      loadNotes();
      updatePreview();
      setSaveStatus('');
    } catch(e) { toast('Could not open note.', 'error'); }
  }

  document.getElementById('newNoteBtn').addEventListener('click', async () => {
    try {
      await forceSavePending();
      const note = await fetch(`${API_BASE}/notes`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:'Untitled'})}).then(r=>r.json());
      currentNote = note;
      await loadNotes();
      await openNote(note.id);
    } catch(e) { toast('Could not create note.', 'error'); }
  });

  function setSaveStatus(text) {
    const el = document.getElementById('saveStatus');
    if (el) el.textContent = text;
  }

  async function forceSavePending() {
    if (autoSaveTimeout && currentNote) {
      const noteToSave = currentNote;
      clearTimeout(autoSaveTimeout);
      autoSaveTimeout = null;
      setSaveStatus('Saving…');
      try {
        const title = document.getElementById('noteTitle').value;
        const content = document.getElementById('noteContent').value;
        await fetch(`${API_BASE}/notes/${noteToSave.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });
        noteToSave.title = title;
        loadNotes();
        setSaveStatus('Saved just now');
      } catch (e) {
        console.error(e);
        setSaveStatus('');
        toast('Could not save note.', 'error');
      }
    }
  }

  function autoSave() {
    if (!currentNote) return;
    clearTimeout(autoSaveTimeout);
    setSaveStatus('Saving…');
    const noteToSave = currentNote;
    autoSaveTimeout = setTimeout(async () => {
      try {
        const title = document.getElementById('noteTitle').value;
        const content = document.getElementById('noteContent').value;
        await fetch(`${API_BASE}/notes/${noteToSave.id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title, content})});
        noteToSave.title = title;
        loadNotes();
        if (currentNote && currentNote.id === noteToSave.id) {
          setSaveStatus('Saved just now');
        }
      } catch(e) {
        console.error(e);
        if (currentNote && currentNote.id === noteToSave.id) {
          setSaveStatus('');
        }
        toast('Could not save note.', 'error');
      } finally {
        if (autoSaveTimeout && currentNote === noteToSave) {
          autoSaveTimeout = null;
        }
      }
    }, 1200);
  }

  window.addEventListener('beforeunload', e => { if (autoSaveTimeout) { e.preventDefault(); e.returnValue=''; } });

  function replaceSelection(transform) {
    const ta = document.getElementById('noteContent');
    const s = ta.selectionStart, e = ta.selectionEnd;
    const sel = ta.value.slice(s,e);
    const rep = transform(sel||'');
    ta.value = ta.value.slice(0,s)+rep+ta.value.slice(e);
    ta.focus(); ta.setSelectionRange(s,s+rep.length);
    updatePreview(); autoSave();
  }

  function formatLines(prefix, placeholder) {
    replaceSelection(sel => (sel||placeholder).split('\n').map(l=>l.trim()?`${prefix}${l}`:l).join('\n'));
  }

  const formats = {
    heading:  () => formatLines('# ','Heading'),
    bold:     () => replaceSelection(t=>`**${t||'bold text'}**`),
    italic:   () => replaceSelection(t=>`*${t||'italic text'}*`),
    bullet:   () => formatLines('- ','List item'),
    numbered: () => replaceSelection(sel=>(sel||'List item').split('\n').map((l,i)=>l.trim()?`${i+1}. ${l}`:l).join('\n')),
    quote:    () => formatLines('> ','Quote'),
    code:     () => replaceSelection(t=>t.includes('\n')?`\`\`\`\n${t}\n\`\`\``:`\`${t||'code'}\``),
    link:     () => replaceSelection(t=>`[${t||'Link text'}](https://example.com)`)
  };

  document.querySelectorAll('.fmt-btn').forEach(btn => btn.addEventListener('click', () => formats[btn.dataset.format]?.()));

  document.getElementById('noteTitle').addEventListener('input', autoSave);
  document.getElementById('noteContent').addEventListener('input', () => { autoSave(); updatePreview(); });

  function updatePreview() {
    document.getElementById('previewContent').innerHTML = marked.parse(document.getElementById('noteContent').value);
  }

  document.getElementById('togglePreviewBtn').addEventListener('click', () => {
    const pane = document.getElementById('previewPane');
    pane.style.display = pane.style.display==='none' ? 'block' : 'none';
  });

  document.getElementById('deleteNoteBtn').addEventListener('click', async () => {
    if (!currentNote || !await confirmDialog('Delete this note?')) return;
    clearTimeout(autoSaveTimeout);
    autoSaveTimeout = null;
    await fetch(`${API_BASE}/notes/${currentNote.id}`, {method:'DELETE'});
    currentNote = null;
    document.getElementById('emptyState').style.display='flex';
    document.getElementById('editorHeader').style.display='none';
    document.getElementById('formatToolbar').style.display='none';
    document.getElementById('noteContent').style.display='none';
    loadNotes();
    toast('Note deleted', 'info');
  });

  loadNotes();
</script>
</body>
</html>
