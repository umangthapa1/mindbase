<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Typing Indicator</title>
    <script src="frontend/js/theme.js?v=20260802"></script>
    <link rel="stylesheet" href="frontend/css/globals.css?v=20260802">
    <style>
        body {
            padding: 20px;
            background-color: var(--bg-void);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 5px;
            font-weight: 500;
        }
        .button:hover {
            background-color: var(--bg-hover);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--bg-surface);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Typing Indicator Test</h1>
        <p>Testing if typing indicator shows/hides properly</p>

        <button class="button" id="showTyping">Show Typing Indicator</button>
        <button class="button" id="hideTyping">Hide Typing Indicator</button>

        <div class="typing-indicator" id="typingIndicator" aria-label="Assistant is typing">
            <div class="msg-avatar" aria-hidden="true">AI</div>
            <div class="typing-dots" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div class="status" id="status">Status: Ready</div>
    </div>

    <script>
        document.getElementById('showTyping').addEventListener('click', function() {
            const indicator = document.getElementById('typingIndicator');
            indicator.classList.add('visible');
            document.getElementById('status').textContent = 'Status: Typing indicator VISIBLE';
            document.getElementById('status').style.borderLeftColor = '#e8eaed';
        });

        document.getElementById('hideTyping').addEventListener('click', function() {
            const indicator = document.getElementById('typingIndicator');
            indicator.classList.remove('visible');
            document.getElementById('status').textContent = 'Status: Typing indicator HIDDEN';
            document.getElementById('status').style.borderLeftColor = '#a3a6ab';
        });
    </script>
</body>
</html>
